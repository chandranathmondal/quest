---
name: CI Dockerfile
on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.published == true && github.ref_name || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - if: github.event.release.published == true
        name: Set image tag based on release tag
        run: echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV

      - if: github.event.release.published == false
        name: Set image tag based on commit SHA
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - run: echo ${{ env.IMAGE_TAG }}
