---
name: CI Dockerfile
on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.published == true && github.ref_name || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - if: github.event.release.published == true
        name: Set image tag based on release tag
        run: echo "IMAGE_TAG=${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.ref_name }}" >> $GITHUB_ENV

      - if: github.event.release.published == false
        name: Set image tag based on commit SHA
        run: echo "IMAGE_TAG=${{ vars.DOCKERHUB_REPOSITORY }}:$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - run: docker build -t ${{ env.IMAGE_TAG }} .

      - run: docker run --rm ${{ env.IMAGE_TAG }} sh -c "cat /etc/os-release | grep ^VERSION"

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: docker push ${{ env.IMAGE_TAG }}
      
